[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200

# Dependencies (plain clones, no git submodules — this repo has no remote):
#   forge install foundry-rs/forge-std --no-git
#   forge install OpenZeppelin/openzeppelin-contracts --no-git
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Target chain: Robinhood Chain, chain id 4663. Public keyless RPC (also usable
# for fork tests via WELLSTREET_ROBINHOOD_RPC_URL in CI):
[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"

[etherscan]
robinhood = { key = "none", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }
